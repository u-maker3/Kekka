<!doctype html><html lang=ja><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>最終開票</title><style>*{box-sizing:border-box}body{margin:0;background:#0c0a10;color:white;font-family:-apple-system,"Hiragino Sans",sans-serif;overflow:hidden}.s{height:100dvh;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,#3d2a50,#09080c 70%);position:relative}.v{position:absolute;opacity:0;transform:scale(.9);transition:.45s;padding:7vw;width:100%}.on{opacity:1;transform:scale(1)}.big{font-size:12vw;font-weight:950}.mid{font-size:7vw;font-weight:900}.gold{color:#ffd84a}.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:90vw;max-width:560px;margin:25px auto}.b{aspect-ratio:1;border-radius:16px;background:#f1dfb4;color:#251d14;border:3px solid #9c7543;display:grid;place-items:center;font-size:9vw;font-weight:950;box-shadow:0 7px #5c432b}.b.open{background:white;box-shadow:0 0 25px #fff8;animation:o .5s}@keyframes o{50%{transform:scale(1.15) rotate(5deg)}}.board{display:grid;gap:8px;width:80vw;max-width:480px;margin:20px auto}.r{display:flex;justify-content:space-around;background:#ffffff12;padding:10px;border-radius:14px;font-size:6vw;font-weight:900}.shake{animation:x .15s infinite alternate}@keyframes x{to{transform:translateX(8px)}}.u{width:min(52vw,290px);max-height:40vh;object-fit:contain}.conf{position:absolute;top:-30px;animation:f 3s linear forwards}@keyframes f{to{transform:translate(var(--x),110vh) rotate(800deg)}}button{position:absolute;bottom:12px;z-index:9;border:0;border-radius:30px;padding:12px 18px;font-weight:900}</style><body><div class=s id=stage>
<div class="v on" id=a><div class=big>最終開票。</div><div class=mid>総投票数 36票</div></div>
<div class=v id=b><div class=mid>7つの箱を<br>開けていきます。</div><div class=boxes id=boxes></div></div>
<div class=v id=c><div class=mid>ここまでの開票結果</div><div class=board id=board></div></div>
<div class=v id=d><div class=mid>残る箱は、あと2つ。</div><div class=big>④ VS ②</div></div>
<div class=v id=e><div class=mid>④を開票……</div><div class=big>7票！</div></div>
<div class=v id=f><div class=mid>ということは……</div><div class=big>②は……</div></div>
<div class=v id=g><div class=mid>ドゥルルルル……🥁</div><div class="big shake">②</div></div>
<div class=v id=h><div class=mid>👑 第1位 👑</div><div class="big gold">②<br>9票！！</div></div>
<div class=v id=i><img src=umeko.PNG class=u><div class=mid>36票も付き合ってくれて<br>ありがとう🤣</div></div>
<button onclick=play()>▶ もう一回見る</button></div><script>
const ids=["a","b","c","d","e","f","g","h","i"],order=[["⑤","3票"],["③","5票"],["①","2票"],["⑥","5票"],["⑦","5票"]];let T=[];
function sh(n){ids.forEach(x=>document.getElementById(x).classList.remove("on"));document.getElementById(n).classList.add("on")}
function setup(){boxes.innerHTML="";["①","②","③","④","⑤","⑥","⑦"].forEach(n=>boxes.innerHTML+=`<div class=b id="x${n}">${n}</div>`);board.innerHTML=""}
function op(n,v){let z=document.getElementById("x"+n);z.innerHTML=n+"<br><small>"+v+"</small>";z.classList.add("open")}
function cf(){for(let j=0;j<55;j++){let z=document.createElement("div");z.className="conf";z.textContent=["🎉","✨","🎊"][j%3];z.style.left=Math.random()*100+"vw";z.style.setProperty("--x",(Math.random()*180-90)+"px");stage.appendChild(z);setTimeout(()=>z.remove(),3300)}}
function play(){T.forEach(clearTimeout);setup();sh("a");let q=(fn,t)=>T.push(setTimeout(fn,t));q(()=>sh("b"),1500);let t=3000;order.forEach(x=>{q(()=>op(x[0],x[1]),t);t+=1100});q(()=>{board.innerHTML=order.map(x=>`<div class=r><b>${x[0]}</b><b>${x[1]}</b></div>`).join("");sh("c")},t+500);q(()=>sh("d"),t+2300);q(()=>sh("e"),t+4000);q(()=>sh("f"),t+5600);q(()=>sh("g"),t+7000);q(()=>{sh("h");cf()},t+9000);q(()=>sh("i"),t+11300)}setup();play();</script>
