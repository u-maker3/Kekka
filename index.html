<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投票レース途中経過</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fff6e4;color:#222;overflow:hidden}.stage{height:100dvh;position:relative;padding:4vh 4vw;background:linear-gradient(#fffaf0 0 82%,#ead8b8 82%)}h1{text-align:center;font-size:7.8vw;margin:0}.status{text-align:center;font-size:4.5vw;font-weight:850;margin:7px 0 10px;min-height:1.5em}.lane{height:8.8vh;border-bottom:2px dashed #cdbb9e;position:relative}.label{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:7vw;font-weight:950}.runner{position:absolute;left:13vw;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:7px;transition:left 1.5s ease}.ball{width:10.5vw;height:10.5vw;max-width:52px;max-height:52px;border-radius:50%;background:#fff;border:3px solid #222;display:grid;place-items:center;font-size:5.8vw;font-weight:950}.vote{font-size:4.8vw;font-weight:950;white-space:nowrap;opacity:0;transform:scale(.5);transition:.35s}.vote.show{opacity:1;transform:scale(1)}.crown{position:absolute;font-size:8vw;z-index:4;opacity:0}.crown.go{animation:crown .8s forwards}@keyframes crown{0%{opacity:0;transform:translateY(-80px) rotate(-15deg)}100%{opacity:1;transform:none}}.u{position:absolute;right:-35vw;bottom:1vh;width:37vw;z-index:3}.u.go{animation:peek .9s forwards}@keyframes peek{to{right:-2vw}}.u img{width:100%}.end{position:absolute;inset:0;z-index:6;background:#17121d;color:#fff;display:grid;place-items:center;text-align:center;padding:7vw;opacity:0;pointer-events:none;transition:.6s}.end.go{opacity:1}.end img{width:min(44vw,235px);max-height:34vh;object-fit:contain}.big{font-size:10vw;font-weight:950;color:#ffd747}.mid{font-size:6vw;font-weight:900;line-height:1.45}.tom{font-size:8vw;font-weight:950;margin-top:18px}button{position:absolute;z-index:10;bottom:10px;left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:11px 18px;background:#222;color:#fff;font-weight:900}
</style></head><body><div class="stage"><h1>🏁 投票レース</h1><div class="status" id="status">途中経過・まずは現在31票！</div><div id="board"></div><div class="crown" id="crown">👑</div><div class="u" id="u"><img src="umeko.PNG"></div>
<div class="end" id="end"><div><img src="umeko.PNG"><div class="mid">現在トップは</div><div class="big">② 9票 👑</div><div class="mid">まだ途中経過やで🤣</div><div class="tom">次回更新は明日！</div></div></div><button onclick="play()">▶ もう一回</button></div>
<script>
const data=[["①",1],["⑤",2],["③",4],["⑥",4],["⑦",5],["④",6],["②",9]];
const board=document.getElementById("board");
data.forEach((x,i)=>{board.innerHTML+=`<div class="lane"><div class="label">${x[0]}</div><div class="runner" id="r${i}"><div class="ball">${x[0]}</div><div class="vote" id="v${i}">${x[1]}票</div></div></div>`});
let timers=[];
function play(){
 timers.forEach(clearTimeout);timers=[];end.classList.remove("go");u.classList.remove("go");crown.classList.remove("go");
 status.textContent="途中経過・まずは現在31票！";
 data.forEach((x,i)=>{document.getElementById("r"+i).style.left="13vw";document.getElementById("v"+i).classList.remove("show")});
 let t=1800;
 data.forEach((x,i)=>{
   timers.push(setTimeout(()=>{status.textContent=x[0]+" は…";document.getElementById("r"+i).style.left=(13+x[1]*5.7)+"vw"},t));
   timers.push(setTimeout(()=>{document.getElementById("v"+i).classList.add("show");status.textContent=x[0]+"　"+x[1]+"票！"},t+1600));
   t+=2600;
 });
 timers.push(setTimeout(()=>{status.textContent="全員そろったで。現在の位置はこれ！"},t));
 timers.push(setTimeout(()=>{const r=document.getElementById("r6").getBoundingClientRect();crown.style.left=(r.left+8)+"px";crown.style.top=(r.top-38)+"px";crown.classList.add("go");status.textContent="👑 現在トップは②・9票！"},t+3000));
 timers.push(setTimeout(()=>u.classList.add("go"),t+4400));
 timers.push(setTimeout(()=>end.classList.add("go"),t+7000));
}
play();
</script></body></html>
