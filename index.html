<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>途中経過 障害物レース</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fff8e9;color:#222;overflow:hidden}.stage{height:100dvh;position:relative;padding:3.5vh 3.5vw;background:linear-gradient(#dff5ff 0 18%,#fff8e9 18% 82%,#d9efbf 82%)}h1{text-align:center;font-size:7.4vw;margin:0}.status{text-align:center;font-size:4.4vw;font-weight:900;min-height:2em;margin:5px 0}.track{position:relative}.lane{height:8.6vh;border-bottom:2px dashed #cbbd9e;position:relative}.label{position:absolute;left:0;top:50%;transform:translateY(-50%);font-size:6.5vw;font-weight:950}.runner{position:absolute;left:11vw;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px;transition:left 1.3s ease}.ball{position:relative;width:38px;height:48px;flex:0 0 38px}
.ball:before{content:"";position:absolute;left:13px;top:0;width:12px;height:12px;border:3px solid #222;border-radius:50%;background:#fff}
.ball:after{content:"";position:absolute;left:18px;top:14px;width:3px;height:23px;background:#222;box-shadow:-8px 9px 0 -1px #222,8px 9px 0 -1px #222;transform-origin:top}
.arm1,.arm2{position:absolute;top:20px;width:17px;height:3px;background:#222;transform-origin:right center}
.arm1{left:3px;transform:rotate(-28deg)}.arm2{left:18px;transform:rotate(28deg)}
.leg1,.leg2{position:absolute;top:35px;width:18px;height:3px;background:#222;transform-origin:left center}
.leg1{left:18px;transform:rotate(55deg)}.leg2{left:18px;transform:rotate(125deg)}
.runner.moving .ball{animation:run .28s infinite alternate}
@keyframes run{from{transform:rotate(-5deg) translateY(-2px)}to{transform:rotate(6deg) translateY(2px)}}.vote{font-size:4.4vw;font-weight:950;opacity:0;white-space:nowrap}.vote.go{animation:pop .4s forwards}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}.ob{position:absolute;font-size:6vw;z-index:2;transition:.4s}.jump{animation:jump .7s}@keyframes jump{50%{transform:translateY(-38px) rotate(-8deg)}}.spin{animation:spin .7s}@keyframes spin{to{transform:translateY(-50%) rotate(360deg)}}.finish{position:absolute;right:3vw;top:0;height:60vh;border-right:5px dashed #e14d4d;opacity:.45}.crown{position:absolute;font-size:8vw;opacity:0;z-index:5}.crown.go{animation:crown .7s forwards}@keyframes crown{from{opacity:0;transform:translateY(-80px) rotate(-20deg)}to{opacity:1;transform:none}}.u{position:absolute;right:-40vw;bottom:0;width:38vw;z-index:4}.u.go{animation:peek .8s forwards}@keyframes peek{to{right:-3vw}}.u img{width:100%}.end{position:absolute;inset:0;background:#17121d;color:#fff;z-index:6;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.6s;padding:7vw}.end.go{opacity:1}.end img{width:min(43vw,230px);max-height:32vh;object-fit:contain}.big{font-size:10vw;font-weight:950;color:#ffd84b}.mid{font-size:6vw;font-weight:900;line-height:1.4}.tom{font-size:8vw;font-weight:950;margin-top:18px}button{position:absolute;z-index:10;bottom:10px;left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:11px 17px;background:#222;color:#fff;font-weight:900}
</style></head><body><div class="stage"><h1>🏃 投票・障害物レース</h1><div class="status" id="status">①〜⑦、横一線からスタート🤣</div><div class="track" id="track"><div class="finish"></div></div><div class="crown" id="crown">👑</div><div class="u" id="u"><img src="umeko.PNG"></div><div class="end" id="end"><div><img src="umeko.PNG"><div class="mid">障害物を抜けて<br>現在トップは…</div><div class="big">② 9票 👑</div><div class="mid">まだ途中経過やで🤣</div><div class="tom">次回更新は明日！</div></div></div><button onclick="play()">▶ もう一回</button></div>
<script>
const data=[["①",1],["②",9],["③",4],["④",6],["⑤",2],["⑥",4],["⑦",5]];
const track=document.getElementById("track");
data.forEach((x,i)=>{track.insertAdjacentHTML("beforeend",`<div class="lane"><div class="label">${x[0]}</div><div class="runner" id="r${i}"><div class="ball"><i class="arm1"></i><i class="arm2"></i><i class="leg1"></i><i class="leg2"></i></div><div class="vote" id="v${i}">${x[1]}票</div></div></div>`)});
const obs=["🍌","🪵","🕳️","🚧","🍌","🪨","🪵"];
obs.forEach((o,i)=>{let e=document.createElement("div");e.className="ob";e.textContent=o;e.style.left=(35+(i%3)*14)+"vw";e.style.top=(i*8.6+5)+"vh";track.appendChild(e)});
let timers=[];
function play(){timers.forEach(clearTimeout);timers=[];end.classList.remove("go");u.classList.remove("go");crown.classList.remove("go");status.textContent="①〜⑦、横一線からスタート🤣";data.forEach((x,i)=>{let r=document.getElementById("r"+i);r.style.left="11vw";r.classList.remove("jump","spin");document.getElementById("v"+i).classList.remove("go")});
let t=1700;
data.forEach((x,i)=>{timers.push(setTimeout(()=>{status.textContent=x[0]+" スタート！";let r=document.getElementById("r"+i);r.classList.add("moving");r.style.left=(11+x[1]*6.1)+"vw";setTimeout(()=>{r.classList.remove("moving");r.classList.add(i%2?"jump":"spin")},900)},t));timers.push(setTimeout(()=>{document.getElementById("v"+i).classList.add("go");status.textContent=x[0]+"は "+x[1]+"票！"},t+1450));t+=2200});
timers.push(setTimeout(()=>status.textContent="全員ゴール位置についたで…👀",t));
timers.push(setTimeout(()=>{let r=document.getElementById("r1").getBoundingClientRect();crown.style.left=(r.left+5)+"px";crown.style.top=(r.top-38)+"px";crown.classList.add("go");status.textContent="👑 現在トップは②・9票！"},t+2500));
timers.push(setTimeout(()=>u.classList.add("go"),t+3800));timers.push(setTimeout(()=>end.classList.add("go"),t+6000))}
play();
</script></body></html>
