<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投票レース</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#fff5df;color:#222;overflow:hidden}.s{height:100dvh;position:relative;padding:5vh 5vw;background:linear-gradient(#fff9ed 0 78%,#ead7b3 78%)}h1{text-align:center;font-size:8vw;margin:0 0 1vh}p{text-align:center;font-weight:800}.lane{height:9vh;border-bottom:2px dashed #cdbb9e;position:relative}.n{position:absolute;top:50%;transform:translateY(-50%);font-size:7vw;font-weight:950}.r{position:absolute;left:13vw;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:8px;transition:left 1.3s cubic-bezier(.2,.9,.2,1)}.ball{width:11vw;height:11vw;max-width:55px;max-height:55px;border-radius:50%;background:white;border:3px solid #222;display:grid;place-items:center;font-size:6vw;font-weight:950}.v{font-size:5vw;font-weight:950;white-space:nowrap}.u{position:absolute;right:-30vw;bottom:2vh;width:38vw;transition:.7s}.u.go{right:-3vw;animation:w .8s infinite alternate}.u img{width:100%}@keyframes w{to{transform:rotate(-5deg) translateY(-8px)}}.end{position:absolute;inset:0;background:#17121d;color:#fff;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.6s;z-index:5;padding:7vw}.end.go{opacity:1}.end img{width:min(45vw,240px);max-height:35vh;object-fit:contain}.big{font-size:11vw;font-weight:950;color:#ffd747}.mid{font-size:6.5vw;font-weight:900;line-height:1.4}button{position:absolute;z-index:10;bottom:12px;left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:11px 18px;background:#222;color:#fff;font-weight:900}</style></head><body><div class="s"><h1>🏁 投票レース</h1><p>途中経過・31票　よーい、ドン🤣</p><div id="b"></div><div class="u" id="u"><img src="umeko.PNG"></div><div class="end" id="e"><div><img src="umeko.PNG"><div class="mid">現在トップは</div><div class="big">② 9票 👑</div><div class="mid">まだゴールちゃうで🤣</div><div class="big" style="font-size:8.5vw;margin-top:20px">次回更新は明日！</div></div></div><button onclick="play()">▶ もう一回</button></div><script>
const d=[["①",1],["②",9],["③",4],["④",6],["⑤",2],["⑥",4],["⑦",5]],b=document.getElementById("b");d.forEach((x,i)=>b.innerHTML+=`<div class="lane"><div class="n">${x[0]}</div><div class="r" id="r${i}"><div class="ball">${x[0]}</div><div class="v">${x[1]}票</div></div></div>`);let t=[];function play(){t.forEach(clearTimeout);e.classList.remove("go");u.classList.remove("go");d.forEach((x,i)=>document.getElementById("r"+i).style.left="13vw");t.push(setTimeout(()=>d.forEach((x,i)=>document.getElementById("r"+i).style.left=(13+x[1]*6)+"vw"),700));t.push(setTimeout(()=>u.classList.add("go"),2400));t.push(setTimeout(()=>e.classList.add("go"),4700))}play();</script></body></html>
