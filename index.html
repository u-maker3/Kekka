<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投票結果発表</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Hiragino Sans",sans-serif;background:#f8ecd2;color:#201913;overflow:hidden}.stage{height:100dvh;position:relative;overflow:hidden;background:linear-gradient(#9b241d 0 18%,#f8ecd2 18% 100%)}.curtain{position:absolute;top:0;width:16vw;height:20vh;background:#b92c22}.curtain.l{left:0}.curtain.r{right:0}.lanterns{position:absolute;top:1vh;left:0;width:100%;display:flex;justify-content:space-around;font-size:9vw}.banner{position:relative;margin:5vh auto 1vh;width:82%;background:#fffaf0;border:4px solid #5d351d;padding:10px;text-align:center;font-size:8vw;font-weight:950;transform:rotate(-1deg);box-shadow:0 7px #5d351d}.total{width:88%;margin:1.2vh auto 0;text-align:center;font-size:5.2vw;font-weight:950;background:#fff;border:3px solid #5d351d;border-radius:16px;padding:8px 10px;color:#2a1b13;box-shadow:0 4px #5d351d}.total b{display:inline-block;font-size:9vw;line-height:1;color:#c12b23;margin-left:6px}.boxes{width:94%;margin:2vh auto 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.box{height:16vh;position:relative;background:linear-gradient(135deg,#e7edf1cc,#bfcbd2aa);border:4px solid #59656b;border-radius:8px;box-shadow:0 7px #3c4448;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}.slot{position:absolute;top:9px;left:20%;width:60%;height:8px;background:#333;border-radius:10px}.paper{position:absolute;background:#fff;width:20px;height:14px;transform:rotate(var(--r));left:var(--x);bottom:var(--y);border:1px solid #aaa}.tag{position:relative;z-index:2;width:70%;margin-bottom:8px;padding:5px;background:#fff;border:2px solid #222;font-size:7vw;font-weight:950;text-align:center}.lid{position:absolute;inset:0;background:#e8edf0;border-radius:4px;transform-origin:top;transition:.6s;z-index:3}.lid:before{content:"";position:absolute;top:12px;left:20%;width:60%;height:8px;background:#333;border-radius:10px}.lid:after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font-size:9vw;font-weight:950}.box.open .lid{transform:perspective(300px) rotateX(105deg);opacity:.15}.box.pop{animation:pop .45s}@keyframes pop{50%{transform:scale(1.08) rotate(2deg)}}.message{text-align:center;margin-top:2vh;font-size:5.5vw;font-weight:950;min-height:2.8em}.final{position:absolute;inset:0;z-index:7;background:#fff1cf;display:grid;place-items:center;text-align:center;padding:5vw;opacity:0;pointer-events:none;transition:.7s}.final.go{opacity:1}.final .title{font-size:7vw;font-weight:950}.final .winner{font-size:16vw;font-weight:950;color:#d32620;text-shadow:3px 3px #ffd34e}.final img{width:min(42vw,230px);max-height:34vh;object-fit:contain}.thanks{font-size:5.5vw;font-weight:900}.conf{position:absolute;top:-30px;z-index:10;animation:fall 3s linear forwards}@keyframes fall{to{transform:translate(var(--x),110vh) rotate(900deg)}}button{position:absolute;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);border:0;border-radius:30px;padding:11px 18px;background:#291d17;color:#fff;font-weight:900}
</style></head><body><div class="stage" id="stage"><div class="curtain l"></div><div class="curtain r"></div><div class="lanterns">🏮🏮🏮🏮🏮</div><div class="banner">投票結果発表</div><div class="total">ただいま開票中！<br>総投票数 <b>38票</b></div><div class="boxes" id="boxes"></div><div class="message" id="msg">7つの投票箱、開けていくで🤣</div>
<div class="final" id="final"><div><div class="title">🎊 最終結果 🎊</div><div class="winner">② 9票 👑</div><img src="umeko.PNG"><div class="thanks">たくさんの投票<br>ありがとうございました🙇🏻‍♀️</div></div></div>
<div class="final" id="release"><div>
  <div class="title">そして……</div>
  <div class="thanks" style="font-size:6.2vw;line-height:1.55;margin-top:18px">たくさんの方に投票いただけたので</div>
  <div class="winner" style="font-size:11vw;margin:14px 0">1位・2位<br>2つ公開！</div>
</div></div>
<div class="final" id="story"><div>
  <div class="title">⏰ 24時間限定</div>
  <div class="thanks" style="font-size:6.3vw;line-height:1.55;margin-top:20px">このあとのストーリーに<br><b>1位・2位のURL</b>を流します</div>
  <div class="winner" style="font-size:10vw;margin-top:26px">次へ →</div>
</div></div><button onclick="play()">▶ もう一回開票</button></div>
<script>
const stage=document.getElementById("stage");
const boxes=document.getElementById("boxes");
const msg=document.getElementById("msg");
const finalPanel=document.getElementById("final");
const releasePanel=document.getElementById("release");
const storyPanel=document.getElementById("story");
const results={"①":3,"②":9,"③":5,"④":7,"⑤":3,"⑥":6,"⑦":5};
const order=["⑤","①","③","⑥","⑦","④","②"];let timers=[];
function makeBox(n){let papers="";for(let i=0;i<Math.min(results[n],8);i++)papers+=`<i class=paper style="--x:${10+Math.random()*70}%;--y:${8+Math.random()*50}px;--r:${-25+Math.random()*50}deg"></i>`;return `<div class=box id="box${n}">${papers}<div class=tag>${n}<br>${results[n]}票</div><div class=lid data-n="${n}"></div></div>`}
function setup(){boxes.innerHTML=["①","②","③","④","⑤","⑥","⑦"].map(makeBox).join("");finalPanel.classList.remove("go");releasePanel.classList.remove("go");storyPanel.classList.remove("go");msg.innerHTML="7つの投票箱、開けていくで🤣"}
function confetti(){for(let i=0;i<70;i++){let e=document.createElement("div");e.className="conf";e.textContent=["🎉","✨","🎊","⭐"][i%4];e.style.left=Math.random()*100+"vw";e.style.setProperty("--x",(Math.random()*180-90)+"px");e.style.animationDelay=Math.random()*.6+"s";stage.appendChild(e);setTimeout(()=>e.remove(),3600)}}
function play(){timers.forEach(clearTimeout);document.querySelectorAll(".conf").forEach(x=>x.remove());setup();let t=1300;order.forEach((n,i)=>{timers.push(setTimeout(()=>{let b=document.getElementById("box"+n);b.classList.add("open","pop");msg.innerHTML=i<5?`投票箱 ${n} を開票！　<b>${results[n]}票！</b>`:i===5?`④を開票…… <b>7票！</b><br>残るは②だけ…`: `最後の②…… <b>9票！！👑</b>`},t));t+=i<5?1300:i===5?1900:2300});timers.push(setTimeout(()=>{finalPanel.classList.add("go");confetti()},t+700));
timers.push(setTimeout(()=>{finalPanel.classList.remove("go");releasePanel.classList.add("go")},t+3900));
timers.push(setTimeout(()=>{releasePanel.classList.remove("go");storyPanel.classList.add("go")},t+7000))}
setup(); setTimeout(play,500);</script></body></html>
